[colors.primary]
background = "#242424"
foreground = "#ffffff"

[cursor]
style = "Beam"

[font]
size = 14

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Hack Nerd Font"
style = "Bold Italic"

[scrolling]
history = 10000
multiplier = 3

[window]
decorations = "full"
dynamic_padding = true
opacity = 0.99

decorations_theme_variant = "Dark"
option_as_alt = "Both"

[window.padding]
x = 5
y = 0


[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
