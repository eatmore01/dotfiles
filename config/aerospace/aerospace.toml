config-version = 2

start-at-login = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'horizontal'

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 0
outer.bottom = 0
outer.top = 0
outer.right = 0

[mode.main.binding]

    alt-enter = 'exec-and-forget open -n -a Alacritty'
    alt-t = 'exec-and-forget open -n -a Telegram'

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'
    alt-left = 'focus left'
    alt-down = 'focus down'
    alt-up = 'focus up'
    alt-right = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'
    alt-shift-left = 'move left'
    alt-shift-down = 'move down'
    alt-shift-up = 'move up'
    alt-shift-right = 'move right'

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'
    alt-0 = 'workspace 10'

    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'
    alt-shift-0 = 'move-node-to-workspace 10'

    # --- layout -----------------------------------------------------------
    alt-b = 'layout horizontal'
    alt-v = 'layout vertical'

    # main
    alt-e = 'layout accordion'
    alt-w = 'layout tiles horizontal vertical'

    alt-f = 'fullscreen'
    alt-shift-space = 'layout floating tiling'
    #


    alt-r = 'mode resize'
    alt-shift-c = 'reload-config'



[mode.resize.binding]
    h     = 'resize width -50'
    j     = 'resize height +50'
    k     = 'resize height -50'
    l     = 'resize width +50'
    left  = 'resize width -50'
    down  = 'resize height +50'
    up    = 'resize height -50'
    right = 'resize width +50'
    enter = 'mode main'
    esc   = 'mode main'

[mode.fullscreen-cycle.binding]

    left  = ['focus dfs-prev', 'fullscreen on']
    right = ['focus dfs-next', 'fullscreen on']
    h     = ['focus dfs-prev', 'fullscreen on']
    l     = ['focus dfs-next', 'fullscreen on']
    alt-e = ['fullscreen off', 'mode main']
    esc   = ['fullscreen off', 'mode main']
